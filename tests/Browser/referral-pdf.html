<!doctype html><meta charset="utf-8"><title>Referral summary PDF regression</title>
<style>body{font-family:Arial;margin:0}.card{padding:20px;border:1px solid #ddd;margin-bottom:15px}table{width:100%;border-collapse:collapse}th,td{padding:8px;text-align:left;border-bottom:1px solid #ddd}.page-head{padding:12px}</style>
<script src="../../public/js/vendor/html2pdf.bundle.min.js"></script>
<button id="export-report-pdf" data-filename="Referral_Test.pdf" data-landscape="0" data-period="2026-10" data-hospital="RS Vina Estetica" data-logo="../../public/images/vina-estetica-logo.png">Export PDF</button><span id="report-pdf-status"></span>
<div id="report-pdf-content"><div class="page-head"><h1>Laporan Keuangan</h1></div><div class="card"><h3>Total Pengeluaran</h3><strong>Rp 500.000</strong></div><div class="card referral-summary"><h3>Rekap Pengeluaran Referral per Penerima</h3><table><thead><tr><th>Nama Penerima</th><th>Jumlah Transaksi</th><th>SC</th><th>RI</th><th>Total Referral</th></tr></thead><tbody id="referral-rows"></tbody><tfoot><tr><th>Total</th><th>60</th><th>30</th><th>30</th><th>Rp 6.000.000</th></tr></tfoot></table></div></div>
<script>
const yearly=new URLSearchParams(location.search).has('yearly');document.getElementById('export-report-pdf').dataset.landscape=yearly?'1':'0';
for(let i=1;i<=60;i++){const row=document.createElement('tr');for(const value of [`Penerima ${i}`,1,i%2?1:0,i%2?0:1,'Rp 100.000']){const cell=document.createElement('td');cell.textContent=value;row.append(cell);}document.getElementById('referral-rows').append(row);}
const original=window.html2pdf;let renderedRows=0,renderedSummary=false;
window.html2pdf=function(...args){const worker=original(...args);const set=worker.set;worker.set=function(options){const configured=set.call(this,options);const from=configured.from;configured.from=function(element,...rest){renderedRows+=element.querySelectorAll('.referral-summary tbody tr').length;if(element.textContent.includes('Rekap Pengeluaran Referral'))renderedSummary=true;return from.call(this,element,...rest);};return configured;};return worker;};
const createURL=URL.createObjectURL.bind(URL);URL.createObjectURL=function(blob){if(blob.type!=='application/pdf')return createURL(blob);blob.arrayBuffer().then(buffer=>{const text=new TextDecoder('latin1').decode(buffer);const result=document.createElement('pre');result.id='result';const pages=(text.match(/\/Type \/Page\b/g)||[]).length;result.textContent=JSON.stringify({bytes:buffer.byteLength,pages,renderedRows,renderedSummary,yearly,passed:buffer.byteLength>10000&&pages>1&&renderedRows===60&&renderedSummary});document.body.replaceChildren(result);});return 'blob:test';};
</script><script src="../../public/js/report-pdf.js"></script><script>window.addEventListener('load',()=>document.getElementById('export-report-pdf').click());</script>
