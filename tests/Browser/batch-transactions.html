<!doctype html><meta charset="utf-8"><title>Batch input regression</title>
<form data-batch-form><div data-batch-rows><section data-batch-row><h3 data-batch-title></h3><button type="button" data-remove-batch-row>Hapus</button><label for="batch-0-date">Tanggal</label><input id="batch-0-date" name="rows[0][expense_date]" type="date" value="2026-10-28"><select name="rows[0][expense_category_id]"><option value="1">Umum</option></select><input name="rows[0][amount]" type="number" min="0.01" step="0.01" value="150000.50"></section></div><button type="button" data-add-batch-row>Tambah</button><strong data-batch-count></strong><button type="submit">Simpan</button><template data-batch-template><section data-batch-row><h3 data-batch-title></h3><button type="button" data-remove-batch-row>Hapus</button><label for="batch-__INDEX__-date">Tanggal</label><input id="batch-__INDEX__-date" name="rows[__INDEX__][expense_date]" type="date" value="2026-10-28"><select name="rows[__INDEX__][expense_category_id]"><option value="1">Umum</option></select><input name="rows[__INDEX__][amount]" type="number" min="0.01" step="0.01" value="250000.25"></section></template></form>
<script src="../../public/js/searchable-select.js"></script><script src="../../public/js/batch-transactions.js"></script><script src="../../public/js/form-controls.js"></script>
<script>
window.addEventListener('load',async()=>{
 const wait=()=>new Promise(r=>setTimeout(r,20));const form=document.querySelector('form');const rows=form.querySelector('[data-batch-rows]');const add=form.querySelector('[data-add-batch-row]');
 add.click();await wait();
 const firstAmount=rows.children[0].querySelector('[data-money-field]');const secondAmount=rows.children[1].querySelector('[data-money-field]');
 const independent=firstAmount.value==='150.000,50'&&secondAmount.value==='250.000,25';
 secondAmount.value='999.000,75';secondAmount.dispatchEvent(new Event('input',{bubbles:true}));
 const serialized=new FormData(form);const decimals=serialized.get('rows[1][amount]')==='999000.75'&&serialized.get('rows[0][amount]')==='150000.50';
 rows.children[1].querySelector('[data-remove-batch-row]').click();const removed=!new FormData(form).has('rows[1][amount]');
 add.click();await wait();const reused=rows.children[1].querySelector('[name="rows[1][expense_date]"]')!==null&&new FormData(form).get('rows[1][amount]')==='250000.25';
 for(let i=0;i<25;i++)add.click();await wait();
 const capped=rows.children.length===20&&add.disabled;
 const ids=[...form.querySelectorAll('[id]')].map(e=>e.id);const uniqueIds=new Set(ids).size===ids.length;
 const selects=rows.querySelectorAll('.searchable-select').length===20;
 const result=document.createElement('pre');result.id='result';result.textContent=JSON.stringify({independent,decimals,removed,reused,capped,uniqueIds,selects,passed:independent&&decimals&&removed&&reused&&capped&&uniqueIds&&selects});document.body.replaceChildren(result);
});
</script>
